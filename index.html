<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Tasks</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1e1f29;font-family:system-ui,sans-serif;color:#e6e6f0;padding:24px}
#app{background:#2a2b3a;max-width:420px;width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);padding:24px}
h1{margin:0 0 16px;font-size:1.4rem}
.row{display:flex;gap:12px;margin-bottom:16px}
#taskInput{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #444560;background:#1e1f29;color:#e6e6f0;font-size:1rem}
#taskInput:focus{outline:2px solid #7c5cff}
#addBtn{background:#7c5cff;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
#addBtn:hover{background:#6a4ce0}
#addBtn:focus{outline:2px solid #7c5cff}
#taskList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
li.task{display:flex;align-items:center;gap:12px;background:#1e1f29;padding:12px;border-radius:8px}
li.task input.done{width:18px;height:18px;accent-color:#7c5cff}
li.task span.text{flex:1;word-break:break-word}
li.task.done span.text,span.text.done{text-decoration:line-through;color:#9a9ab0}
button.del{background:none;border:none;color:#9a9ab0;font-size:1.1rem;cursor:pointer;padding:4px 8px}
button.del:hover{color:#ff6b6b}
#emptyMsg{color:#9a9ab0;text-align:center;margin:16px 0}
#counter{color:#9a9ab0;margin:16px 0 0;text-align:center;font-size:.9rem}
@media (max-width:480px){
#app{padding:16px;border-radius:0;max-width:100%;min-height:100vh}
body{padding:0}
}
</style>
</head>
<body>
<div id="app">
  <h1>Quick Tasks</h1>
  <div class="inputRow">
    <input id="taskInput" type="text" placeholder="Add a task...">
    <button id="addBtn">Add</button>
  </div>
  <ul id="taskList"></ul>
  <p id="emptyMsg">No tasks yet</p>
  <p id="counter">0 tasks left</p>
</div>
<script>
let tasks = [];
let nid = 1;

function render() {
  const list = document.getElementById('taskList');
  const empty = document.getElementById('emptyMsg');
  const counter = document.getElementById('counter');
  list.innerHTML = '';
  tasks.forEach(t => {
    const li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'checkbox';
    cb.checked = t.done;
    cb.onchange = () => { t.done = !t.done; render(); };
    const span = document.createElement('span');
    span.className = 'text';
    span.textContent = t.text;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = () => { tasks = tasks.filter(x => x.id !== t.id); render(); };
    li.appendChild(cb);
    li.appendChild(span);
    li.appendChild(del);
    list.appendChild(li);
  });
  empty.style.display = tasks.length === 0 ? 'block' : 'none';
  const left = tasks.filter(t => !t.done).length;
  counter.textContent = left + ' tasks left';
}

function addTask() {
  const input = document.getElementById('taskInput');
  const val = input.value.trim();
  if (!val) return;
  tasks.push({ id: nid++, text: val, done: false });
  input.value = '';
  render();
}

document.getElementById('addBtn').onclick = addTask;
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

render();
</script>
</body>
</html>
